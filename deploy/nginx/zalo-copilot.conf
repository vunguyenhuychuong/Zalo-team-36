# /etc/nginx/conf.d/zalo-copilot.conf
#
# server_name khop CHINH XAC zah-36.123c.vn. nginx uu tien exact match hon
# wildcard, nen file nay thang file star.123c.vn.conf cua BTC ma khong phai sua
# file do. Muon tra lai nguyen trang: xoa file nay roi reload nginx.
#
# Cert dung chung cua BTC (wildcard *.123c.vn) nen phu cho ten mien nay.

server {
    listen 80;
    server_name zah-36.123c.vn;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zah-36.123c.vn;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    ssl_certificate     /etc/nginx/certs/123c.vn.pem;
    ssl_certificate_key /etc/nginx/certs/123c.vn.key;
    ssl_dhparam         /etc/nginx/certs/dhparams.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    access_log /var/log/nginx/zalo-copilot.access.log;
    error_log  /var/log/nginx/zalo-copilot.error.log;

    # App Node chay o 127.0.0.1:4000, khong mo ra ngoai internet.
    # Chinh server Express phuc vu luon client/dist nen khong can alias file tinh.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
